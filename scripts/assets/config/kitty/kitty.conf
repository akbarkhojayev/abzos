# -----------------------------------------------------------------------------
# abzOS 1.0 — Modern Kitty Terminal Configuration
# -----------------------------------------------------------------------------

# Font Configuration
font_family      JetBrains Mono Regular
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        10.5

# Window Layout & Padding
window_padding_width 12 14
placement_strategy center
hide_window_decorations no
confirm_os_window_close 0

# Cursor
cursor #00f0ff
cursor_text_color #13151f
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Mouse
mouse_hide_wait 3.0
url_color #00f0ff
url_style curly
open_url_with default

# Performance & Rendering
repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell no

# Background & Opacity
background_opacity 0.94
dynamic_background_opacity yes

# Tab Bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #13151f
active_tab_background   #00f0ff
active_tab_font_style   bold
inactive_tab_foreground #a9b1d6
inactive_tab_background #1a1b26

# Color Scheme (Tokyo Night Cyberpunk)
foreground            #c0caf5
background            #13151f
selection_foreground  #c0caf5
selection_background  #283457

# Normal Colors
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# Bright Colors
color8  #414868
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7dcfff
color13 #c0caf5
color14 #00f0ff
color15 #ffffff
